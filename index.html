
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>都道府県アキネーター</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#eef3ff;text-align:center;padding:14px;color:#223;margin:0}
main{max-width:620px;margin:auto}
section{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 10px #ccd5eb}
button,input{font-size:17px;padding:12px;margin:6px;border-radius:9px}
button{background:#315bd6;color:white;border:0}
input{max-width:95%;border:1px solid #aaa}
.hidden{display:none}
.clues{text-align:left;background:#f3f6ff;padding:14px;border-radius:12px;margin:12px 0}
.clues li{margin:9px 0;font-size:18px}
.timer{font-size:44px;font-weight:bold;color:#d33;font-variant-numeric:tabular-nums}
#feedback{font-weight:bold;min-height:28px}
#ranking{text-align:left}
small{color:#667}
</style>
</head>
<body>
<main>
<h1>🗾 都道府県アキネーター</h1>
<p id="status">Firebase接続中...</p>

<section id="lobby">
<h2>ニックネーム（1〜12文字）</h2>
<input id="nickname" maxlength="12" placeholder="ニックネーム">
<h2>ルームを作ろう</h2>
<button id="create">ルームを作成</button>
<h3>または参加</h3>
<input id="code" placeholder="ルームコード">
<button id="join">参加する</button>
</section>

<section id="room" class="hidden">
<h2>ルームコード</h2>
<h1 id="roomCode"></h1>
<h3>参加プレイヤー</h3>
<ul id="players"></ul>
<p id="waiting"></p>
<button id="start" class="hidden">ゲーム開始！</button>
</section>

<section id="game" class="hidden">
<h2>早押しバトル！</h2>
<div class="timer" id="timer">100</div>
<p id="progress">第1問</p>
<h2>この都道府県はどこ？</h2>
<div class="clues"><ul id="clues"></ul></div>
<input id="guess" placeholder="都道府県名を入力">
<button id="answer">回答する</button>
<p id="feedback"></p>
<p id="lastWinner"></p>
</section>

<section id="finish" class="hidden">
<h2>🏆 最終ランキング</h2>
<ol id="ranking"></ol>
<p id="finishMessage"></p>
</section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getDatabase,ref,set,get,update,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const app=initializeApp({
apiKey:"AIzaSyCYbFmB_DHeN7f6u__XCXi1I6E2YFdyz_A",
authDomain:"prefecture-akinator-battle.firebaseapp.com",
databaseURL:"https://prefecture-akinator-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"prefecture-akinator-battle",
storageBucket:"prefecture-akinator-battle.firebasestorage.app",
messagingSenderId:"298658912619",
appId:"1:298658912619:web:8504bc936d515bffcc942e"
});

const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

const prefs=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
"新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県",
"静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県",
"奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県",
"徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県",
"熊本県","大分県","宮崎県","鹿児島県","沖縄県"
];

const capitals=[
"札幌市","青森市","盛岡市","仙台市","秋田市","山形市","福島市",
"水戸市","宇都宮市","前橋市","さいたま市","千葉市","新宿区",
"横浜市","新潟市","富山市","金沢市","福井市","甲府市","長野市",
"岐阜市","静岡市","名古屋市","津市","大津市","京都市","大阪市",
"神戸市","奈良市","和歌山市","鳥取市","松江市","岡山市","広島市",
"山口市","徳島市","高松市","松山市","高知市","福岡市","佐賀市",
"長崎市","熊本市","大分市","宮崎市","鹿児島市","那覇市"
];

const shinkansen=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"栃木県","群馬県","埼玉県","東京都","新潟県","富山県","石川県",
"福井県","長野県","岐阜県","静岡県","愛知県","滋賀県","京都府",
"大阪府","兵庫県","岡山県","広島県","山口県","福岡県","熊本県",
"鹿児島県"
];

const airports=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","千葉県","東京都","新潟県","富山県","石川県","福井県",
"長野県","静岡県","愛知県","大阪府","兵庫県","鳥取県","島根県",
"岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県",
"福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県",
"沖縄県"
];

const coast=[
"北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","千葉県","東京都","神奈川県","新潟県","富山県","石川県",
"福井県","静岡県","愛知県","三重県","京都府","大阪府","兵庫県",
"和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県",
"香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県",
"大分県","宮崎県","鹿児島県","沖縄県"
];

const designated=[
"神奈川県","埼玉県","千葉県","新潟県","静岡県","愛知県",
"大阪府","京都府","兵庫県","岡山県","広島県","福岡県","熊本県"
];

const capitalMatch=[
"青森県","岩手県","宮城県","秋田県","山形県","福島県",
"茨城県","栃木県","群馬県","埼玉県","千葉県","新潟県",
"富山県","福井県","山梨県","長野県","岐阜県","静岡県",
"三重県","滋賀県","京都府","大阪府","奈良県","和歌山県",
"鳥取県","岡山県","広島県","山口県","徳島県","香川県",
"愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県",
"大分県","宮崎県","鹿児島県"
];

const profiles=prefs.map((p,i)=>({
p,
capital:capitals[i],
clues:[
["新幹線の駅がある",shinkansen.includes(p)],
["空港がある",airports.includes(p)],
["海に面している",coast.includes(p)],
["県名と県庁所在地名が一致する",capitalMatch.includes(p)],
["政令指定都市が1つ以上ある",designated.includes(p)]
]
}));

function clean(s){
return s.normalize("NFKC")
.replace(/[？?。、！!\s　]/g,"")
.replace(/(都|道|府|県)$/,"");
}

function buildQuestions(){
return [...profiles]
.sort(()=>Math.random()-.5)
.map(x=>({
answer:x.p,
clues:x.clues.map(([label,value])=>({label,value}))
}));
}

let user=null;
let room=null;
let rd=null;
let name="";
let off=null;
let tick=null;
let shownRound=-1;

const roomRef=()=>ref(db,"rooms/"+room);

function getName(){
let n=$("nickname").value.trim();
if(!n||n.length>12){
alert("ニックネームを1〜12文字で入力してね");
return null;
}
return n;
}

function renderPlayers(){
$("players").innerHTML="";
Object.entries(rd?.players||{}).forEach(([id,p])=>{
let li=document.createElement("li");
li.textContent=p.name+(id===rd.host?"（作成者）":"");
$("players").append(li);
});
}

function renderGame(){
if(!rd||rd.state!=="playing")return;

let idx=rd.questionIndex||0;
let q=rd.questions?.[idx];

if(!q){
finishGame();
return;
}

$("progress").textContent=`第${idx+1}問`;

if(shownRound!==idx){
shownRound=idx;
$("clues").innerHTML="";

q.clues.forEach(c=>{
let li=document.createElement("li");

if(c.label==="県名と県庁所在地名が一致する"){
li.textContent=c.label+"："+(c.value?"はい":"いいえ");
}else{
li.textContent=c.label+"："+(c.value?"ある":"ない");
}

$("clues").append(li);
});

$("guess").value="";
$("feedback").textContent="";
$("lastWinner").textContent=rd.lastWinnerName
?`前の問題の正解者：${rd.lastWinnerName}`:"";
}
}

function finishGame(){
if(tick){
clearInterval(tick);
tick=null;
}

$("game").classList.add("hidden");
$("finish").classList.remove("hidden");

let scores=rd.scores||{};
let players=rd.players||{};

let sorted=Object.entries(players)
.map(([id,p])=>({
name:p.name,
score:scores[id]||0
}))
.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"ja"));

$("ranking").innerHTML="";

sorted.forEach((p,i)=>{
let li=document.createElement("li");
li.textContent=`${i+1}位：${p.name} — ${p.score}問正解`;
$("ranking").append(li);
});

$("finishMessage").textContent="100秒終了！おつかれさまでした！";
}

function updateTimer(){
if(!rd||rd.state!=="playing")return;

let left=Math.max(
0,
100-Math.floor((Date.now()-rd.startedAt)/1000)
);

$("timer").textContent=left;

if(left<=0){
runTransaction(roomRef(),old=>{
if(!old||old.state!=="playing")return;
old.state="finished";
return old;
}).catch(console.error);
}
}

function listen(){
if(off)off();

off=onValue(roomRef(),s=>{
rd=s.val();
if(!rd)return;

$("lobby").classList.add("hidden");
$("room").classList.remove("hidden");
$("roomCode").textContent=room;

renderPlayers();

if(rd.state==="waiting"){
$("game").classList.add("hidden");
$("finish").classList.add("hidden");

$("start").classList.toggle("hidden",rd.host!==user.uid);
$("waiting").textContent=rd.host===user.uid
?"参加者がそろったら開始！"
:"開始を待っています";

}else if(rd.state==="playing"){
$("room").classList.add("hidden");
$("game").classList.remove("hidden");
$("finish").classList.add("hidden");

renderGame();
updateTimer();

if(!tick)tick=setInterval(updateTimer,250);

}else if(rd.state==="finished"){
$("room").classList.add("hidden");
finishGame();
}
});
}

$("create").onclick=async()=>{
if(!user)return alert("Firebase接続中です");

name=getName();
if(!name)return;

try{
do{
room=Math.random().toString(36).slice(2,8).toUpperCase();
}while((await get(ref(db,"rooms/"+room))).exists());

await set(roomRef(),{
host:user.uid,
state:"waiting",
players:{[user.uid]:{name}},
scores:{[user.uid]:0}
});

listen();

}catch(e){
alert("作成エラー："+e.message);
room=null;
}
};

$("join").onclick=async()=>{
if(!user)return alert("Firebase接続中です");

name=getName();
if(!name)return;

room=$("code").value.trim().toUpperCase();

if(!room)return alert("ルームコードを入力してね");

try{
let s=await get(roomRef());

if(!s.exists()||s.val().state!=="waiting"){
room=null;
return alert("参加できるルームが見つかりません");
}

await update(ref(db,"rooms/"+room+"/players/"+user.uid),{name});
await update(ref(db,"rooms/"+room+"/scores"),{[user.uid]:0});

listen();

}catch(e){
alert("参加エラー："+e.message);
room=null;
}
};

$("start").onclick=async()=>{
if(rd?.host!==user.uid)return;

let questions=buildQuestions();
let scores={};

Object.keys(rd.players||{}).forEach(id=>{
scores[id]=0;
});

try{
shownRound=-1;

await update(roomRef(),{
state:"playing",
startedAt:Date.now(),
questionIndex:0,
questions,
scores,
lastWinnerName:""
});

}catch(e){
alert("開始エラー："+e.message);
}
};

$("answer").onclick=async()=>{
if(!rd||rd.state!=="playing")return;

let guess=clean($("guess").value);
if(!guess)return;

let idx=rd.questionIndex;
let q=rd.questions?.[idx];

if(!q)return;

if(guess!==clean(q.answer)){
$("feedback").textContent="違うみたい！何度でも挑戦できるよ。";
return;
}

try{
let result=await runTransaction(roomRef(),old=>{
if(!old||old.state!=="playing"||old.questionIndex!==idx)return;

if(Date.now()-old.startedAt>=100000){
old.state="finished";
return old;
}

old.scores=old.scores||{};
old.scores[user.uid]=(old.scores[user.uid]||0)+1;
old.lastWinnerName=old.players?.[user.uid]?.name||name;
old.questionIndex=(old.questionIndex||0)+1;

if(old.questionIndex>=old.questions.length){
old.state="finished";
}

return old;
});

$("feedback").textContent=result.committed
?"正解！次の問題へ！"
:"この問題はすでに次へ進んでいるよ！";

}catch(e){
$("feedback").textContent="通信エラー："+e.message;
}
};

try{
let credential=await signInAnonymously(auth);
user=credential.user;
$("status").textContent="オンライン接続完了";
}catch(e){
$("status").textContent="接続エラー："+e.code+" / "+e.message;
}
</script>
</body>
</html>
