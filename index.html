<style>

main{max-width:560px;margin:auto}
section{background:white;padding:18px;border-radius:16px;margin:14px 0}
button,input{font-size:17px;padding:12px;margin:6px;border-radius:9px;box-sizing:border-box}
button{background:#315bd6;color:white;border:0}
input{max-width:95%;border:1px solid #aaa}
.hidden{display:none}
li{text-align:left;margin:8px}
#result,#answerLog{white-space:pre-wrap}
#answerLog{background:#f3f6ff;padding:12px;border-radius:10px}

<body>
<main>
<h1>🗾 都道府県アキネーター</h1>
<p id="status">Firebase接続中...</p>

<section id="lobby">
<h2>ニックネーム（1〜12文字）</h2>
<input id="nickname" maxlength="12" placeholder="ニックネーム">
<h2>ルームを作ろう</h2>
<button id="create">ルームを作成</button>
<h3>または参加</h3>
<input id="code" placeholder="ルームコード">
<button id="join">参加する</button>
</section>

<section id="room" class="hidden">
<h2>ルームコード</h2>
<h1 id="roomCode"></h1>
<h3>参加プレイヤー</h3>
<ul id="players"></ul>
<p id="waiting"></p>
<button id="start" class="hidden">ゲーム開始！</button>
</section>

<section id="game" class="hidden">
<h2>ゲーム中！</h2>
<p id="questionCount">質問数：0</p>
<h3>質問を入力</h3>
<input id="question" placeholder="例：新幹線の駅がありますか？">
<button id="ask">質問する</button>
<p id="answerLog">質問するとコンピューターが回答するよ。</p>
<hr>
<h3>都道府県を予想！</h3>
<input id="guess" placeholder="都道府県名">
<button id="answer">回答する</button>
<h3 id="result"></h3>
<small>質問と回答は自分の画面だけに表示されます。</small>
</section>
</main>

"兵庫県","奈良県","和歌山県","鳥取県","島根県",

function clean(s){
return s.normalize("NFKC").replace(/[？?。、！!\s]/g,"").toLowerCase();
}

// 質問の自動判定
function answerQuestion(raw,p){
const q=clean(raw);

const checks=[
{keys:["北海道地方","北海道"],yes:["北海道"]},
{keys:["東北地方","東北"],yes:regions["東北"]},
{keys:["関東地方","関東"],yes:regions["関東"]},
{keys:["中部地方","中部"],yes:regions["中部"]},
{keys:["東海地方","東海"],yes:regions["東海"]},
{keys:["北陸地方","北陸"],yes:regions["北陸"]},
{keys:["近畿地方","関西地方","近畿","関西"],yes:regions["近畿"]},
{keys:["中国地方"],yes:regions["中国"]},
{keys:["四国地方","四国"],yes:regions["四国"]},
{keys:["九州地方","九州"],yes:regions["九州"]},
{keys:["日本海側","日本海に面","日本海に接"],yes:japanSea},
{keys:["太平洋側","太平洋に面","太平洋に接"],yes:pacific},
{keys:["瀬戸内海","瀬戸内"],yes:seto},
{keys:["新幹線の駅","新幹線駅","新幹線が停ま","新幹線が止ま","新幹線は通"],yes:shinkansen},
{keys:["空港","飛行場"],yes:airports},
{keys:["文化遺産"],yes:cultural},
{keys:["自然遺産"],yes:natural},
{keys:["世界遺産"],yes:[...new Set([...cultural,...natural])]},
{keys:["50hz","50ヘルツ","交流50"],yes:hz50},
{keys:["60hz","60ヘルツ","交流60"],yes:hz60}
];

for(const c of checks){
if(c.keys.some(k=>q.includes(clean(k)))){
return c.yes.includes(p)?"はい！":"いいえ。";
}
}

if(/海に面|海岸線|海があります|海に接/.test(q)){
return inland.includes(p)?"いいえ。":"はい！";
}

const pref=prefs.find(x=>q.includes(clean(x)));

if(pref&&/(ですか|でしょうか|ありますか|なの|なのか|？|\?)/.test(raw)){
return pref===p?"はい！":"いいえ。";
}

return "まだ判定できない質問だよ。別の聞き方を試してね。";
}

let user=null;
let room=null;
let rd=null;
let name="";
let off=null;

const rr=()=>ref(db,"rooms/"+room);

function renderWinner(d){
if(d.state==="finished"){
$("result").textContent=
(d.winnerName||d.players?.[d.winner]?.name||"誰か")
+"さんが正解しました！\n"+
"正解は"+d.answer+"！\n"+
"獲得ポイント："+d.score+"点";
}
}

function listen(){
if(off)off();

off=onValue(rr(),s=>{
rd=s.val();
if(!rd)return;

$("lobby").classList.add("hidden");
$("room").classList.remove("hidden");
$("roomCode").textContent=room;
$("players").innerHTML="";

Object.entries(rd.players||{}).forEach(([id,p])=>{
let li=document.createElement("li");
li.textContent=p.name+(id===rd.host?"（作成者）":"");
$("players").append(li);
});

if(rd.state==="waiting"){
$("start").classList.toggle("hidden",rd.host!==user.uid);
$("waiting").textContent=
rd.host===user.uid?"参加者がそろったら開始！":"開始を待っています";
$("game").classList.add("hidden");
}else{
$("start").classList.add("hidden");
$("game").classList.remove("hidden");
$("questionCount").textContent="質問数："+(rd.count||0);
renderWinner(rd);
}
});
}

function getName(){
let n=$("nickname").value.trim();
if(!n||n.length>12){
alert("ニックネームを1〜12文字で入力してね");
return null;
}
return n;
}

// ルーム作成
$("create").onclick=async()=>{
if(!user)return alert("接続中です");
name=getName();
if(!name)return;

try{
do{
room=Math.random().toString(36).slice(2,8).toUpperCase();
}while((await get(ref(db,"rooms/"+room))).exists());

await set(rr(),{
host:user.uid,
state:"waiting",
players:{[user.uid]:{name}}
});
listen();
}catch(e){
alert("作成エラー："+e.message);
}
};

// ルーム参加
$("join").onclick=async()=>{
if(!user)return alert("接続中です");
name=getName();
if(!name)return;

room=$("code").value.trim().toUpperCase();
if(!room)return alert("ルームコードを入力してね");

try{
let s=await get(rr());

if(!s.exists()||s.val().state!=="waiting"){
room=null;
return alert("参加できるルームが見つかりません");
}

await set(ref(db,"rooms/"+room+"/players/"+user.uid),{name});
listen();
}catch(e){
alert("参加エラー："+e.message);
}
};

// ゲーム開始
$("start").onclick=async()=>{
if(rd?.host!==user.uid)return;

let a=prefs[Math.floor(Math.random()*prefs.length)];

try{
await update(rr(),{
state:"playing",
answer:a,
startedAt:Date.now(),
count:0,
winner:null,
winnerName:null,
score:null
});

$("answerLog").textContent="質問するとコンピューターが回答するよ。";
$("result").textContent="";
}catch(e){
alert("開始エラー："+e.message);
}
};

// 質問
$("ask").onclick=async()=>{
let q=$("question").value.trim();
if(!q||rd?.state!=="playing")return;

let a=answerQuestion(q,rd.answer);

try{
await runTransaction(
ref(db,"rooms/"+room+"/count"),
n=>(n||0)+1
);

$("answerLog").textContent=
"あなたの質問："+q+"\n"+
"コンピューター："+a;

$("question").value="";
}catch(e){
alert("質問エラー："+e.message);
}
};

// 回答
$("answer").onclick=async()=>{
let g=clean($("guess").value.trim());
if(!g||rd?.state!=="playing")return;

if(g!==clean(rd.answer)){
$("result").textContent="違うみたい。もう一度考えてね！";
return;
}

let score=Math.max(
1,
100-
Math.floor((Date.now()-rd.startedAt)/10000)-
Math.floor((rd.count||0)/3)*2
);

try{
let t=await runTransaction(rr(),old=>{
if(!old||old.state!=="playing")return;

old.state="finished";
old.winner=user.uid;
old.winnerName=old.players?.[user.uid]?.name||name;
old.score=score;

return old;
});

if(!t.committed){
$("result").textContent="ゲームは終了しています";
}else{
renderWinner(t.snapshot.val());
}
}catch(e){
alert("回答エラー："+e.message);
}
};

// Firebaseログイン
try{
let x=await signInAnonymously(auth);
user=x.user;
$("status").textContent="オンライン接続完了";
}catch(e){
$("status").textContent="接続エラー："+e.message;
}
</script>
