
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>都道府県アキネーター</title>
<style>
body{font-family:sans-serif;background:#eef3ff;text-align:center;padding:20px;color:#223}
main{max-width:500px;margin:auto}
section{background:white;padding:20px;border-radius:16px;margin:15px 0}
button,input{font-size:17px;padding:12px;margin:6px;border-radius:9px}
button{background:#315bd6;color:white;border:0}
input{max-width:90%;border:1px solid #aaa}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>🗾 都道府県アキネーター</h1>
<p id="status">接続中...</p>
<section id="lobby">
<h2>ルームを作ろう</h2>
<button id="create">ルームを作成</button>
<h3>または参加</h3>
<input id="code" placeholder="ルームコード">
<button id="join">参加する</button>
</section>
<section id="room" class="hidden">
<h2>ルームコード</h2>
<h1 id="roomCode"></h1>
<h3>参加者</h3>
<ul id="players"></ul>
<button id="start" class="hidden">ゲーム開始</button>
<p id="waiting"></p>
</section>
<section id="game" class="hidden">
<h2>みんなで当てよう！</h2>
<p id="questionCount">質問数：0</p>
<input id="question" placeholder="質問を入力">
<button id="ask">質問する</button>
<ul id="questions"></ul>
<hr>
<input id="guess" placeholder="都道府県名">
<button id="answer">回答する</button>
<p id="result"></p>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import {getDatabase,ref,set,get,update,onValue,runTransaction} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const config={
apiKey:"AIzaSyCYbFmB_DHe9N7f6u__XCXi1I6E2YFdyz_A",
authDomain:"prefecture-akinator-battle.firebaseapp.com",
databaseURL:"https://prefecture-akinator-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"prefecture-akinator-battle",
storageBucket:"prefecture-akinator-battle.firebasestorage.app",
messagingSenderId:"298658912619",
appId:"1:298658912619:web:8504bc936d515bffcc942e"
};

const app=initializeApp(config);
const auth=getAuth(app);
const db=getDatabase(app);
const prefectures=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

let user=null,room=null,roomData=null;
const $=id=>document.getElementById(id);
const roomRef=()=>ref(db,"rooms/"+room);

signInAnonymously(auth).then(result=>{
 user=result.user;
 $("status").textContent="オンライン接続完了";
}).catch(error=>$("status").textContent="接続エラー："+error.message);

function listen(){
 onValue(roomRef(),snapshot=>{
  roomData=snapshot.val();
  if(!roomData)return;
  $("lobby").classList.add("hidden");
  $("room").classList.remove("hidden");
  $("roomCode").textContent=room;
  $("players").innerHTML="";
  Object.entries(roomData.players||{}).forEach(([id,p])=>{
   const li=document.createElement("li");
   li.textContent=p.name+(id===roomData.host?"（作成者）":"");
   $("players").appendChild(li);
  });
  if(roomData.state==="waiting"){
   $("start").classList.toggle("hidden",roomData.host!==user.uid);
   $("waiting").textContent=roomData.host===user.uid?"参加者がそろったら開始！":"開始を待っています";
   $("game").classList.add("hidden");
  }else{
   $("start").classList.add("hidden");
   $("game").classList.remove("hidden");
   $("questionCount").textContent="質問数："+(roomData.count||0);
   $("questions").innerHTML="";
   Object.values(roomData.questions||{}).forEach(q=>{
    const li=document.createElement("li");
    li.textContent=q;
    $("questions").appendChild(li);
   });
   if(roomData.state==="finished"){
    $("result").textContent="正解は "+roomData.answer+"！";
   }
  }
 });
}

async function createRoom(){
 room=Math.random().toString(36).slice(2,8).toUpperCase();
 await set(roomRef(),{
  host:user.uid,state:"waiting",
  players:{[user.uid]:{name:"プレイヤー"+user.uid.slice(0,4)}}
 });
 listen();
}
$("create").onclick=async()=>{
 if(!user)return alert("接続中です。少し待ってね");
 try{await createRoom()}catch(e){alert(e.message)}
};
$("join").onclick=async()=>{
 if(!user)return alert("接続中です。少し待ってね");
 room=$("code").value.trim().toUpperCase();
 if(!room)return alert("コードを入力してね");
 try{
  const s=await get(roomRef());
  if(!s.exists())return alert("ルームが見つかりません");
  const d=s.val();
  if(d.state!=="waiting")return alert("このルームはゲーム中です");
  await update(ref(db,"rooms/"+room+"/players/"+user.uid),{
   name:"プレイヤー"+user.uid.slice(0,4)
  });
  listen();
 }catch(e){alert(e.message)}
};
$("start").onclick=async()=>{
 const answer=prefectures[Math.floor(Math.random()*prefectures.length)];
 await update(roomRef(),{
  state:"playing",answer,startedAt:Date.now(),count:0,questions:{}
 });
};
$("ask").onclick=async()=>{
 const q=$("question").value.trim();
 if(!q)return;
 const qref=ref(db,"rooms/"+room+"/questions");
 await runTransaction(qref,old=>{
  old=old||{};
  old[user.uid+"_"+Date.now()]=q;
  return old;
 });
 await runTransaction(ref(db,"rooms/"+room+"/count"),n=>(n||0)+1);
 $("question").value="";
};
$("answer").onclick=async()=>{
 const guess=$("guess").value.trim();
 if(!guess)return;
 const s=await get(roomRef());
 const d=s.val();
 if(d.state!=="playing")return;
 if(guess!==d.answer){
  $("result").textContent="違うみたい。もう一度考えてね！";
  return;
 }
 const elapsed=Math.floor((Date.now()-d.startedAt)/10000);
 const score=Math.max(1,100-elapsed-(d.count||0)*2);
 await runTransaction(roomRef(),old=>{
  if(!old||old.state!=="playing")return;
  old.state="finished";
  old.winner=user.uid;
  old.score=score;
  return old;
 });
 $("result").textContent="正解！獲得ポイント："+score;
};
</script>
</body>
</html>
